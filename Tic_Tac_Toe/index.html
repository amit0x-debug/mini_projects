<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Retro Neon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col items-center justify-center font-['Rajdhani'] overflow-hidden">
    <div class="stars absolute inset-0 pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md px-4 flex flex-col items-center">
        <h1 class="text-5xl font-bold mb-8 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 font-['Orbitron'] drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]">
            TIC TAC TOE
        </h1>

        <div class="w-full bg-white/5 backdrop-blur-xl rounded-3xl p-6 border border-white/10 shadow-2xl mb-8 flex justify-around items-center">
            <div id="player-x" class="flex flex-col items-center transition-all duration-300 scale-110">
                <span class="text-xs uppercase tracking-widest text-cyan-400 mb-1">Player X</span>
                <span id="score-x" class="text-3xl font-bold font-['Orbitron']">0</span>
                <div class="w-8 h-1 bg-cyan-400 mt-2 rounded-full shadow-[0_0_10px_#22d3ee] active-turn-indicator"></div>
            </div>

            <div class="h-12 w-px bg-white/10"></div>

            <div id="player-o" class="flex flex-col items-center opacity-50 transition-all duration-300">
                <span class="text-xs uppercase tracking-widest text-fuchsia-500 mb-1">Player O</span>
                <span id="score-o" class="text-3xl font-bold font-['Orbitron']">0</span>
                <div class="w-8 h-1 bg-fuchsia-500 mt-2 rounded-full shadow-[0_0_10px_#d946ef] active-turn-indicator opacity-0"></div>
            </div>
        </div>

        <div class="game-board grid grid-cols-3 gap-3 w-full aspect-square bg-white/5 p-4 rounded-3xl border border-white/10 shadow-inner">
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="0"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="1"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="2"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="3"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="4"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="5"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="6"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="7"></div>
            <div class="cell bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-200 group relative" data-index="8"></div>
        </div>

        <div id="status-message" class="mt-8 text-xl font-medium tracking-wide text-white/70 h-8">
            Player <span class="text-cyan-400 font-bold">X</span>'s Turn
        </div>

        <button id="reset-btn" class="mt-8 px-10 py-3 bg-white/5 border border-white/10 rounded-full font-bold uppercase tracking-widest hover:bg-white/15 hover:border-white/30 transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg">
            Reset Game
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
